services:
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DB_SSL_CA_FILE: /app/certs/prod-ca-2021.crt
    volumes:
      - ./certs/prod-ca-2021.crt:/app/certs/prod-ca-2021.crt:ro
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
  worker:
    build: .
    command: ["node", "dist/workers/main.js"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      DB_SSL_CA_FILE: /app/certs/prod-ca-2021.crt
    volumes:
      - ./certs/prod-ca-2021.crt:/app/certs/prod-ca-2021.crt:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
volumes:
  redis-data:
